# ===============================
# DATABASE CONNECTION
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/Studdict?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
  
  # ===============================
  # JPA / HIBERNATE CONFIGURATION
  # ===============================
  # "update" automatically creates/updates database tables based on your Java entities
spring.jpa.hibernate.ddl-auto=update
  
  # Print SQL queries to the console (great for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
  
  # Specify the MySQL dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect